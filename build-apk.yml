name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests (sans Kivy)
        run: |
          pip install numpy ezdxf svgpathtools pytest
          python -m pytest -q tests

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Buildozer (SDK, NDK, python-for-android)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev ccache

      - name: Installer Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Compiler l'APK (debug)
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: cave3dviewer-apk
          path: bin/*.apk
