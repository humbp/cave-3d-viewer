name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version affichée (ex: 0.1.1)"
        required: true
        default: "0.1.0"
      version_code:
        description: "Code de version entier Android (ex: 2)"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dépôt
        uses: actions/checkout@v4

      - name: Déterminer la version et le version.code
        id: ver
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VER_NAME: ${{ inputs.version_name }}
          INPUT_VER_CODE: ${{ inputs.version_code }}
        run: |
          if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "tag" ]]; then
            RAW_TAG="${REF_NAME#v}"
            VER_NAME="$RAW_TAG"
            IFS='.' read -r MAJ MIN PAT <<< "$RAW_TAG"
            MAJ=${MAJ:-0}; MIN=${MIN:-0}; PAT=${PAT:-0}
            VER_CODE=$(( (10#${MAJ} * 10000) + (10#${MIN} * 100) + 10#${PAT} ))
            [[ "$VER_CODE" -le 0 ]] && VER_CODE=1
          else
            VER_NAME="$INPUT_VER_NAME"
            VER_CODE="$INPUT_VER_CODE"
          fi
          echo "name=$VER_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VER_CODE" >> "$GITHUB_OUTPUT"
          echo "Version APK: $VER_NAME (code: $VER_CODE)"

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Buildozer & Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-android-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: |
            buildozer-android-${{ runner.os }}-

      - name: Installer dépendances système pour Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev ccache python3-pip
          pip install --upgrade pip cython==0.29.36 buildozer setuptools wheel

      - name: Appliquer la version dans buildozer.spec et main.py
        id: apply_ver
        shell: bash
        env:
          VER_NAME: ${{ steps.ver.outputs.name }}
          VER_CODE: ${{ steps.ver.outputs.code }}
        run: |
          sed -i "s/^version = .*/version = $VER_NAME/" buildozer.spec
          sed -i "s/^version\.code = .*/version.code = $VER_CODE/" buildozer.spec
          sed -i "s/0.1.0-dev/$VER_NAME (build $VER_CODE)/" main.py

      - name: Compiler l'APK Debug avec Buildozer
        run: buildozer android debug

      - name: Renommer l'APK avec la version
        shell: bash
        env:
          VER_NAME: ${{ steps.ver.outputs.name }}
          VER_CODE: ${{ steps.ver.outputs.code }}
        run: |
          mkdir -p dist_apk
          cp bin/*-debug.apk "dist_apk/Cave3DTopo-v${VER_NAME}-code${VER_CODE}.apk"
          ls -lh dist_apk/

      - name: Publier l'APK en Artifact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Cave3DTopo-v${{ steps.ver.outputs.name }}
          path: dist_apk/*.apk

      - name: Créer une Release GitHub si tag v*
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist_apk/*.apk
          generate_release_notes: true
          
